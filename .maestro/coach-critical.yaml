appId: com.lastshotlabs.aicoach
name: Coach conversation, metrics, workout, billing, and privacy
---
- launchApp:
    clearState: true
- tapOn:
    text: Wait
    optional: true
- assertVisible: PocketShot Coach
- assertVisible:
    id: coach-connection
- tapOn:
    id: ask-coach
- extendedWaitUntil:
    visible:
      id: confirm-action
    timeout: 10000
- tapOn:
    id: confirm-action
- scrollUntilVisible:
    element:
      id: log-weight
    direction: DOWN
    centerElement: true
- tapOn:
    id: log-weight
- scrollUntilVisible:
    element:
      id: set-goal
    direction: DOWN
    centerElement: true
- tapOn:
    id: set-goal
- assertVisible: Goal progress.*
- scrollUntilVisible:
    element:
      id: start-workout
    direction: DOWN
    centerElement: true
- tapOn:
    id: start-workout
- assertVisible:
    id: coach-connection
- scrollUntilVisible:
    element:
      id: log-set
    direction: DOWN
    centerElement: true
- tapOn:
    id: log-set
- assertVisible:
    id: coach-connection
- scrollUntilVisible:
    element:
      id: complete-workout
    direction: DOWN
    centerElement: true
- tapOn:
    id: complete-workout
- assertVisible:
    id: coach-connection
- assertVisible: 'Workout: complete'
- scrollUntilVisible:
    element:
      id: restore-pro
    direction: DOWN
    centerElement: true
- tapOn:
    id: restore-pro
- assertVisible: 'Access: active'
- scrollUntilVisible:
    element:
      id: request-export
    direction: DOWN
    centerElement: true
- tapOn:
    id: request-export
- assertVisible: 'Export: ready'
