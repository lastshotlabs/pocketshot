appId: com.lastshotlabs.burndown
name: Burndown cold invite link
---
- stopApp
- openLink: burndown://join/BURN-42
- tapOn:
    text: Open
    optional: true
- tapOn:
    text: Wait
    optional: true
- extendedWaitUntil:
    visible:
      id: burndown-lobby-title
    timeout: 60000
- assertVisible:
    id: burndown-lobby-title
