appId: com.lastshotlabs.sgforum
name: Community post, message, moderation, privacy, and reconnect
---
- launchApp:
    clearState: true
- tapOn:
    text: Wait
    optional: true
- tapOn:
    id: complete-onboarding
- assertVisible: Trail Talk
- tapOn:
    id: reconnect
- tapOn:
    id: tab-compose
- tapOn:
    id: write-draft
- tapOn:
    id: publish-thread
- tapOn:
    id: tab-feed
- assertVisible:
    id: published-thread-title
- tapOn:
    id: tab-messages
- tapOn:
    id: typing
- tapOn:
    id: send-message
- tapOn:
    id: read-messages
- tapOn:
    id: tab-privacy
- tapOn:
    id: block-user
- tapOn:
    id: privacy-export
- assertVisible: 'Export: ready'
