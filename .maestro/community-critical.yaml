appId: com.lastshotlabs.pocketshot.community
name: Community post, message, moderation, privacy, and reconnect
---
- launchApp:
    clearState: true
- tapOn:
    id: complete-onboarding
- assertVisible: Trail Talk
- tapOn:
    id: reconnect
- tapOn: compose
- tapOn:
    id: write-draft
- tapOn:
    id: publish-thread
- tapOn: feed
- assertVisible: Offline trail report
- tapOn: messages
- tapOn:
    id: typing
- tapOn:
    id: send-message
- tapOn:
    id: read-messages
- tapOn: privacy
- tapOn:
    id: block-user
- tapOn:
    id: privacy-export
- assertVisible: 'Export: ready'
