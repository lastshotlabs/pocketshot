appId: com.lastshotlabs.burndown
name: Burndown six-player landscape shared table
---
- launchApp:
    clearState: true
- tapOn:
    text: Wait
    optional: true
- scrollUntilVisible:
    element:
      id: setup-six-player-table
    direction: DOWN
    centerElement: true
- tapOn:
    id: setup-six-player-table
- scrollUntilVisible:
    element:
      id: burndown-lobby-title
    direction: UP
    centerElement: true
- assertVisible:
    id: burndown-lobby-title
- assertVisible: Jo · 3 lives
- assertVisible: Rae · 3 lives
- setOrientation: LANDSCAPE_LEFT
- scrollUntilVisible:
    element:
      id: start-match
    direction: DOWN
    centerElement: true
- tapOn:
    id: start-match
- assertVisible:
    id: shared-handoff-curtain
- tapOn:
    id: arm-seat
- assertVisible: Your turn
- setOrientation: PORTRAIT
