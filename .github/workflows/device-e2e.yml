name: Device E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: device-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: hitshot
            flow: .maestro/party-critical.yaml .maestro/party-deep-link.yaml
          - product: aicoach
            flow: .maestro/coach-critical.yaml
          - product: sgforum
            flow: .maestro/community-critical.yaml
          - product: burndown
            flow: .maestro/burndown-critical.yaml .maestro/burndown-deep-link.yaml .maestro/burndown-landscape.yaml
          - product: blankslate
            flow: .maestro/blankslate-critical.yaml .maestro/blankslate-deep-link.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lastshotlabs'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install current package in production app
        run: |
          npm run build
          archive=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          npm install --prefix "products/${{ matrix.product }}" \
            --legacy-peer-deps --package-lock=false
          npm install --prefix "products/${{ matrix.product }}" "$RUNNER_TEMP/$archive" \
            --no-save --package-lock=false --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate and compile Android app
        working-directory: products/${{ matrix.product }}
        run: |
          npx expo prebuild --platform android --clean --no-install
          ./android/gradlew -p android assembleRelease --no-daemon
      - name: Install Maestro CLI
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Run critical journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put global hide_error_dialogs 1
            adb install -r "products/${{ matrix.product }}/android/app/build/outputs/apk/release/app-release.apk"
            ANDROID_MAESTRO_DIAGNOSTICS_DIR="$RUNNER_TEMP/android-maestro-${{ matrix.product }}" scripts/run-android-maestro.sh ${{ matrix.flow }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-${{ matrix.product }}-failure
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/android-maestro-${{ matrix.product }}
          if-no-files-found: ignore

  ios-maestro:
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: hitshot
            flow: .maestro/party-critical.yaml .maestro/party-deep-link.yaml
          - product: aicoach
            flow: .maestro/coach-critical.yaml
          - product: sgforum
            flow: .maestro/community-critical.yaml
          - product: burndown
            flow: .maestro/burndown-critical.yaml .maestro/burndown-deep-link.yaml .maestro/burndown-landscape.yaml
          - product: blankslate
            flow: .maestro/blankslate-critical.yaml .maestro/blankslate-deep-link.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lastshotlabs'
      - run: npm ci --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install current package in production app
        run: |
          npm run build
          archive=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          npm install --prefix "products/${{ matrix.product }}" \
            --legacy-peer-deps --package-lock=false
          npm install --prefix "products/${{ matrix.product }}" "$RUNNER_TEMP/$archive" \
            --no-save --package-lock=false --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate iOS app
        working-directory: products/${{ matrix.product }}
        run: |
          npx expo prebuild --platform ios --clean --no-install
          npx pod-install ios
      - name: Boot isolated iOS simulator
        id: simulator
        run: |
          runtime=$(xcrun simctl list runtimes available -j |
            jq -r '[.runtimes[] | select(.name | startswith("iOS"))] | last | .identifier')
          device=$(xcrun simctl create \
            "Pocketshot-${{ matrix.product }}-${{ github.run_id }}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16 \
            "$runtime")
          echo "id=$device" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device"
          open -a Simulator
          xcrun simctl bootstatus "$device" -b
      - name: Compile iOS simulator app
        working-directory: products/${{ matrix.product }}
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.id }}
        run: |
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -list -json |
            jq -e --arg scheme "$scheme" '.workspace.schemes | index($scheme) != null'
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -sdk iphonesimulator \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/pocketshot-${{ matrix.product }}-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Install Maestro CLI
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Run critical journeys
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.id }}
        run: |
          products="$RUNNER_TEMP/pocketshot-${{ matrix.product }}-derived-data/Build/Products/Release-iphonesimulator"
          app=$(find "$products" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          echo "Installing $app on simulator $DEVICE_ID"
          xcrun simctl install "$DEVICE_ID" "$app"
          "$HOME/.maestro/bin/maestro" --device "$DEVICE_ID" test ${{ matrix.flow }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-ios-${{ matrix.product }}-failure
          path: ~/.maestro/tests
          if-no-files-found: ignore
      - name: Delete iOS simulator
        if: always() && steps.simulator.outputs.id
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.id }}
        run: xcrun simctl delete "$DEVICE_ID" || true
