name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lastshotlabs'
      - run: npm ci --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run verify:consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify:showcase
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify:party
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify:coach
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify:community
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify:burndown
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify:blankslate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check:release-artifacts
      - run: npm run check:security
      - run: npm run check:accessibility
      - run: npm run check:performance
      - run: npm run check:maestro
      - run: npm run check:product-release
      - run: npm audit --omit=dev --audit-level=high
      - name: Generate and validate production SBOM
        run: |
          npm sbom --omit=dev --sbom-format=cyclonedx > pocketshot-sbom.cdx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' pocketshot-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: pocketshot-production-sbom
          path: pocketshot-sbom.cdx.json
          if-no-files-found: error
